[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fe-daily-runner"
version = "0.1.0"
description = "Python/OpenAI FE daily study page generator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "filelock>=3.13",
  "httpx>=0.27",
  "jinja2>=3.1",
  "openai>=1.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "freezegun>=1.5",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-httpx>=0.30",
  "respx>=0.21",
]

[project.scripts]
fe-daily-publish = "fe_daily.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
