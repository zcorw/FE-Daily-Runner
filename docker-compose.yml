services:
  fe-daily-runner:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      - TZ=Asia/Tokyo
      - QUESTION_BANK_SERVICE_URL=http://question-bank-runtime:8000
      - OUTPUT_DIR=site
      - STATIC_PUBLISH_DIR=/app/published-site
      - TEMPLATE_DIR=templates
      - RUN_MODE=dry-run
      - EXISTING_PAGE_POLICY=fail
    networks:
      - default
      - fe-shared
    volumes:
      - ./site:/app/site
      - ./state:/app/state
      - ./logs:/app/logs
      - ./personal:/app/personal
      - ${HOST_STATIC_PUBLISH_DIR:-/var/www/codex-test-daily}:/app/published-site

networks:
  fe-shared:
    external: true
