services:
  fe-daily-runner:
    build:
      context: .
    environment:
      - TZ=Asia/Tokyo
      - QUESTION_BANK_SERVICE_URL=http://question-bank-runtime:8000
      - OUTPUT_DIR=site
      - TEMPLATE_DIR=templates
      - RUN_MODE=dry-run
      - EXISTING_PAGE_POLICY=fail
    networks:
      - default
      - fe-shared
    volumes:
      - ./site:/app/site
      - ./state:/app/state
      - ./logs:/app/logs

networks:
  fe-shared:
    external: true
